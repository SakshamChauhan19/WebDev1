<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 450" width="240" height="450">
  <!-- Pink Foliage Background -->
  <g fill="#f594b9">
    <circle cx="100" cy="180" r="50"/>
    <circle cx="140" cy="150" r="45"/>
    <circle cx="80" cy="130" r="55"/>
    <circle cx="130" cy="90" r="50"/>
    <circle cx="90" cy="60" r="45"/>
    <circle cx="120" cy="40" r="35"/>
    <circle cx="60" cy="200" r="40"/>
    <circle cx="150" cy="190" r="40"/>
    <!-- Foliage Highlights -->
    <path d="M 60 120 Q 90 70 120 70 Q 150 90 140 140 Q 170 180 130 220 Q 70 240 50 190 Z" fill="#faaec7"/>
  </g>
  <!-- Trunk and Branches -->
  <g stroke="#783e15" stroke-linecap="round" fill="none">
    <path d="M 100 450 Q 105 320 102 240 Q 100 160 105 80" stroke-width="16"/>
    <path d="M 102 300 Q 80 260 65 220" stroke-width="8"/>
    <path d="M 103 210 Q 85 170 70 140" stroke-width="7"/>
    <path d="M 102 270 Q 125 240 150 225" stroke-width="8"/>
    <path d="M 102 180 Q 130 150 155 130" stroke-width="7"/>
    <!-- Perch branch -->
    <path d="M 103 235 Q 120 225 150 225" stroke-width="9"/>
  </g>
  <!-- Owl -->
  <g id="owl">
    <!-- Body & Belly -->
    <ellipse cx="145" cy="200" rx="22" ry="26" fill="#6d3915"/>
    <ellipse cx="145" cy="208" rx="14" ry="16" fill="#a46332"/>
    <!-- Big Owl Eyes -->
    <circle cx="137" cy="190" r="9" fill="#ffffff" stroke="#4a250c" stroke-width="1.5"/>
    <circle cx="153" cy="190" r="9" fill="#ffffff" stroke="#4a250c" stroke-width="1.5"/>
    <circle cx="138" cy="190" r="5" fill="#111111"/>
    <circle cx="152" cy="190" r="5" fill="#111111"/>
    <circle cx="136" cy="188" r="1.5" fill="#ffffff"/>
    <circle cx="150" cy="188" r="1.5" fill="#ffffff"/>
    <!-- Beak & Feet -->
    <polygon points="145,195 142,203 148,203" fill="#f59e0b"/>
    <ellipse cx="139" cy="225" rx="4" ry="2.5" fill="#f59e0b"/>
    <ellipse cx="151" cy="225" rx="4" ry="2.5" fill="#f59e0b"/>
  </g>
</svg>
